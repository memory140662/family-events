<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族活動報名</title>
<style>
  * { box-sizing: border-box; }
  body { font: 20px/1.5 system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 16px; background: #fff8f0; color: #222; }
  h1 { font-size: 26px; margin: 0 0 16px; }
  h2 { font-size: 24px; margin: 0 0 8px; }
  .card { background: #fff; border-radius: 16px; padding: 16px; margin: 0 0 16px; box-shadow: 0 1px 4px #0002; }
  button { font: inherit; min-height: 56px; border: 0; border-radius: 12px; padding: 0 16px; background: #e8e8e8; color: #222; }
  .primary { background: #087f3c; color: #fff; font-weight: bold; }
  .wide { display: block; width: 100%; margin-top: 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid button { font-size: 26px; min-height: 72px; }
  .muted { color: #333; font-size: 20px; }
  .big { font-size: 28px; font-weight: bold; }
  .ok { color: #06a648; }
  .link { background: none; color: #333; text-decoration: underline; min-height: 52px; font-weight: bold; }
  .mine { background: #e8f5e9; padding: 8px 12px; border-radius: 8px; }
  .wait { font-size: 24px; text-align: center; margin-top: 30vh; }
  label { display: block; font-weight: bold; }
  .warn { color: #b45309; font-weight: bold; }
  input, textarea { font: inherit; width: 100%; min-height: 56px; padding: 0 12px; margin: 4px 0 16px; border: 2px solid #bbb; border-radius: 12px; background: #fff; }
  textarea { padding: 8px 12px; }
  /* 新增活動頁：選中「不克參加」改白底綠框，讓「建立活動」維持唯一實心綠，長輩不會混淆（Gemini） */
  .btn-decline.primary { background: #fff; color: #087f3c; border: 3px solid #087f3c; }
  /* 活動列表卡片（Gemini 設計）：標題 → 時間 → 地點 → 共幾人／您的狀態 */
  .card.ev { padding: 12px 16px; margin-bottom: 12px; cursor: pointer; }
  .ev-head { display: flex; justify-content: space-between; align-items: baseline; }
  .ev h2 { font-size: 22px; margin: 0 0 4px; }
  .ev-arrow { font-size: 24px; color: #888; font-weight: bold; line-height: 1; }
  .ev-meta { font-size: 20px; color: #555; margin-bottom: 4px; }
  .ev-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .ev-foot .mine { margin: 0; }
  .ev-total { font-size: 20px; font-weight: bold; color: #087f3c; }
  /* iOS（LINE 內建瀏覽器）的日期／時間框有原生外觀與最小寬度，會撐破版面、文字置中 */
  input[type=date], input[type=time] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; line-height: 52px; }
  input::-webkit-date-and-time-value { text-align: left; margin: 0; }
</style>
</head>
<body>
<div id="app">載入中…</div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = '2011955883-6uGgxKog';
const API = 'https://script.google.com/macros/s/AKfycbw5df_Kxf2leySx2_MFJhA_-8-e7tYldqX5n9QMSVegw_1kqaEvkwOKMIUWT41xClJc/exec';

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const show = html => { app.innerHTML = html; scrollTo(0, 0); };
let g, me, state, entries = [], target; // target：連結指定的活動（?e=），打開後直接進該活動

main();

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID }); // init 之後網址上的 ?g= 才會還原
    if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });
    const q = new URLSearchParams(location.search);
    g = q.get('g'); target = q.get('e');
    me = await liff.getProfile();
    await call('load');
    home();
  } catch (e) {
    if (e.code === 'unbound') return show(`<h1>⚠️ 此群組尚未啟用</h1>
      <p>這個群組還沒開啟功能喔！請先在 LINE 群組傳送「<b>#報名</b>」即可啟用。</p>
      <button class="primary wide" onclick="liff.closeWindow()">關閉視窗</button>
      <button class="wide" onclick="location.reload()">已傳送 #報名，再試一次</button>`);
    show(`<p>發生錯誤：${esc(e.message)}</p><button class="primary wide" onclick="location.reload()">重新整理</button>`);
  }
}

async function post(action, data = {}) {
  const res = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action, g, userId: me.userId, ...data }) })).json();
  if (res.error) throw Object.assign(new Error(res.error), { code: res.code });
  return res;
}

async function call(action, data = {}) {
  show('<p class="wait">資料處理中，請稍候…</p>');
  state = await post(action, data);
}

// 包一層：寫入失敗時顯示錯誤，並讓使用者回到首頁重試
async function run(fn) {
  try { await fn(); } catch (e) {
    show(`<p>${esc(e.message)}</p><button class="primary wide" onclick="reload()">回首頁</button>`);
  }
}
const reload = () => run(async () => { await call('load'); home(); });

function home() {
  if (!state.family) return pickFamily(); // 選完家庭會再回到這裡，target 仍有效
  const i = state.events.findIndex(ev => ev.id === target);
  target = null; // 只在第一次打開時跳轉；活動過期或找不到就留在列表
  if (i >= 0) return detail(i);
  show(`<h1>${esc(state.groupName || '家族活動')}</h1>
    ${state.events.length ? state.events.map(eventCard).join('') : '<p class="card">目前沒有活動</p>'}
    <button class="primary wide" onclick="createForm()">＋ 新增活動</button>
    <p class="muted">目前是<b>「${esc(state.family)}」</b> <button class="link" onclick="pickFamily()">不是？更換</button></p>`);
}

// 列表只放摘要（Gemini 設計）：整張卡片可點，進詳細頁看名單與報名
function eventCard(ev, i) {
  return `<div class="card ev" role="button" onclick="detail(${i})">
    <div class="ev-head"><h2>${esc(ev.title)}</h2><span class="ev-arrow">›</span></div>
    <div class="ev-meta">📅 ${fmtDate(ev.date)} ${esc(ev.time)}</div>
    ${ev.place ? `<div class="ev-meta">📍 ${esc(ev.place)}</div>` : ''}
    <div class="ev-foot"><span class="ev-total">共 ${ev.total} 人</span>${mineTag(ev)}</div>
  </div>`;
}

function mineTag(ev) {
  const mine = ev.replies.find(r => r.family === state.family);
  return `<p class="mine ${mine ? 'ok' : ''}"><b>您：${mine ? (mine.count ? `已報名 ${mine.count} 位 ✅` : '不去') : '尚未回覆'}</b></p>`;
}

// 詳細頁：操作放上面，長輩不用往下滑；名單放下面
function detail(i) {
  const ev = state.events[i];
  const mine = ev.replies.find(r => r.family === state.family);
  const pick = (n, label, cls = '') => `<button class="${cls} ${mine && mine.count === n ? 'primary' : ''}" onclick="signup(${i}, ${n})">${label}</button>`;
  const replies = ev.replies.map(r => `${esc(r.family)} ${r.count || '不去'}`).join('、');
  show(`<button class="link" onclick="home()">〈 回活動列表</button>
    <h1>${esc(ev.title)}</h1>
    <div>📅 ${fmtDate(ev.date)} ${esc(ev.time)}</div>
    ${ev.place ? `<div>📍 ${esc(ev.place)}</div>` : ''}
    ${mineTag(ev)}
    <p class="big">「${esc(state.family)}」參加人數？</p>
    <div class="grid">${[1, 2, 3, 4, 5, 6, 7, 8].map(n => pick(n, n)).join('')}</div>
    ${pick(0, '本次不克參加', 'wide')}
    <div class="card" style="margin-top:16px">
      <p class="big">目前共 ${ev.total} 人參加</p>
      ${replies ? `<div>${replies}</div>` : '<div class="muted">還沒有人回覆</div>'}
      ${ev.pending.length ? `<div class="muted">尚未回覆：${ev.pending.map(esc).join('、')}</div>` : ''}
    </div>
    ${ev.canEdit ? `<button class="wide" onclick="createForm(${i})">✏️ 編輯活動內容</button>` : ''}`);
}

function fmtDate(d) {
  const t = new Date(d + 'T00:00');
  return `${t.getMonth() + 1}/${t.getDate()}（${'日一二三四五六'[t.getDay()]}）`;
}

function pickFamily() {
  show(`<h1>請問怎麼稱呼您？</h1>
    <div class="grid">${state.families.map((f, i) => `<button onclick="join(state.families[${i}])">${esc(f)}</button>`).join('')}</div>
    <div class="card" style="margin-top:24px">
      <label for="fam">清單裡沒有？新增稱呼</label>
      <input id="fam" maxlength="10">
      <button class="primary wide" onclick="join(document.getElementById('fam').value)">新增</button>
    </div>
    ${state.family ? `<button class="link" onclick="renameForm()">✏️ 修改稱呼</button>` : ''}`);
}

const join = family => run(async () => { await call('join', { family }); home(); });

// 只能改自己目前的稱呼（Gemini：入口放選擇頁底部、二次確認）
function renameForm() {
  show(`<h1>修改稱呼</h1>
    <label for="nn">把「${esc(state.family)}」改成</label>
    <input id="nn" maxlength="10" value="${esc(state.family)}">
    <button class="primary wide" onclick="rename()">確定修改</button>
    <button class="wide" onclick="pickFamily()">取消</button>`);
}

const rename = () => {
  const name = document.getElementById('nn').value.trim();
  if (!name) return alert('請輸入稱呼');
  if (confirm(`確定將「${state.family}」改為「${name}」？`)) run(async () => { await call('rename', { family: name }); home(); });
};

const link = e => `https://liff.line.me/${LIFF_ID}?g=${g}` + (e ? `&e=${e}` : '');

// 以使用者本人帳號在聊天室發訊息；不是從聊天室打開就略過，失敗也不影響主流程
async function notify(messages) {
  try {
    if (liff.isInClient() && liff.getContext().type !== 'none') await liff.sendMessages(messages);
  } catch (e) { console.warn('群組通知失敗', e); }
}

const signup = (i, n) => run(async () => {
  const ev = state.events[i], { id, title } = ev;
  await call('signup', { eventId: id, count: n });
  const total = state.events.find(e => e.id === id).total;
  await notify([signupFlex(ev, n ? `「${state.family}」報名 ${n} 位 ✅` : `「${state.family}」不克參加`, `目前共 ${total} 位`)]);
  show(`<p class="big ok">✅ 已送出</p><p class="big">「${esc(state.family)}」：${n ? `${n} 位` : '不去'}</p>
    <p>「${esc(title)}」目前共 ${total} 位</p>
    <button class="primary wide" onclick="home()">回活動列表</button>
    <button class="wide" onclick="liff.closeWindow()">關閉</button>`);
});

// 新增與編輯共用同一張表單；編輯時帶入原值、不顯示接龍匯入
function createForm(i) {
  const ev = i === undefined ? null : state.events[i];
  const today = new Date().toLocaleDateString('sv'); // yyyy-mm-dd
  const val = k => ev ? esc(ev[k]) : '';
  entries = [];
  show(`<h1>${ev ? '編輯活動' : '新增活動'}</h1>
    ${ev ? '' : `<label for="raw">從 LINE 接龍快速帶入（選填）</label>
    <textarea id="raw" rows="3" placeholder="在此貼上 LINE 群組接龍文字..."></textarea>
    <button type="button" id="pb" class="wide" onclick="parseRelay()">帶入接龍內容</button>
    <div id="found"></div>`}
    <label for="t" style="margin-top:16px">活動名稱</label><input id="t" placeholder="例如：11月慶生餐會" maxlength="30" value="${val('title')}">
    <label for="d">日期</label><input id="d" type="date" min="${today}" value="${val('date')}">
    <label for="h">時間</label><input id="h" type="time" value="${val('time')}">
    <label for="p">地點</label><input id="p" placeholder="例如：龍潭蔣府宴" maxlength="50" value="${val('place')}">
    <div id="list"></div>
    ${ev ? '' : `<p class="big">「${esc(state.family)}」參加人數？</p>
    <div id="mine"><div class="grid">${[1, 2, 3, 4, 5, 6, 7, 8].map(n => `<button data-n="${n}" onclick="pickMine(${n})">${n}</button>`).join('')}</div>
    <button class="wide btn-decline" data-n="0" onclick="pickMine(0)">本次不克參加</button></div>
    <hr style="margin:24px 0;border:none;border-top:2px dashed #ccc">`}
    <button class="primary wide" onclick="${ev ? `save(${i})` : 'create()'}">${ev ? '儲存修改' : '建立活動'}</button>
    <button class="wide" onclick="${ev ? `detail(${i})` : 'home()'}">取消</button>`);
}

// 貼上接龍 → 後端解析 → 帶入欄位並列出已接龍的稱呼；解析不到就留空讓人手填
async function parseRelay() {
  const btn = document.getElementById('pb'), found = document.getElementById('found');
  btn.disabled = true; btn.textContent = '解析中…';
  try {
    const r = await post('parse', { text: document.getElementById('raw').value });
    [['t', r.title], ['d', r.date], ['h', r.time], ['p', r.place]].forEach(([id, v]) => { if (v) document.getElementById(id).value = v; });
    entries = r.entries; // 接龍裡若有自己的稱呼，就成為預選的人數
    found.innerHTML = !r.date && !entries.length ? '<p class="warn">無法辨識接龍內容，請直接在下方手動填寫。</p>' : '';
    showEntries();
  } catch (e) {
    found.innerHTML = '<p class="warn">解析失敗，請改用手動填寫。</p>';
  }
  btn.disabled = false; btn.textContent = '帶入接龍內容';
}

// 報名小卡片（Gemini 設計）：每戶都會發一則，所以精簡到約三行高
function signupFlex(ev, line, total) {
  const meta = t => ({ type: 'text', text: t, size: 'xs', color: '#666666', margin: 'xs', wrap: true });
  return { type: 'flex', altText: `${line}｜${ev.title}`, contents: { type: 'bubble', size: 'kilo',
    body: { type: 'box', layout: 'vertical', paddingAll: 'md', contents: [
      { type: 'text', text: ev.title, weight: 'bold', size: 'md', wrap: true, color: '#111111' },
      meta(`📅 ${fmtDate(ev.date)} ${ev.time}`.trim()),
      ...(ev.place ? [meta(`📍 ${ev.place}`)] : []), // 沒地點就不放，LINE 不接受空字串
      { type: 'separator', margin: 'sm' },
      { type: 'text', text: line, weight: 'bold', size: 'sm', color: '#087f3c', margin: 'sm', wrap: true },
      { type: 'box', layout: 'horizontal', margin: 'xs', alignItems: 'center', contents: [
        { type: 'text', text: total, size: 'xs', color: '#666666', flex: 1, gravity: 'center' },
        { type: 'button', style: 'primary', color: '#087f3c', height: 'sm', flex: 1,
          action: { type: 'uri', label: '我也要報名', uri: link(ev.id) } }] }] } } };
}

// 新活動卡片（Gemini 設計）：發起人之後可長按「設為公告」
function eventFlex(d, id) {
  const total = d.entries.reduce((n, e) => n + e.count, 0);
  const summary = d.entries.length
    ? `已報名：${d.entries.map(e => `${e.family} ${e.count || '不去'}`).join('、')}（共 ${total} 位）` : '尚無人報名';
  const text = (t, size, color, bold) => ({ type: 'text', text: t, size, color, wrap: true, ...(bold && { weight: 'bold' }) });
  return { type: 'flex', altText: `📢 新活動：${d.title}`, contents: { type: 'bubble', size: 'mega',
    header: { type: 'box', layout: 'vertical', paddingBottom: 'none', contents: [text('📢 新活動', 'lg', '#087f3c', true)] },
    body: { type: 'box', layout: 'vertical', spacing: 'md', contents: [
      text(d.title, 'xxl', '#111111', true), { type: 'separator' },
      { type: 'box', layout: 'vertical', spacing: 'sm', contents: [
        text(`📅 ${fmtDate(d.date)} ${d.time}`.trim(), 'lg', '#1e293b', true),
        text(`📍 ${d.place || '地點待定'}`, 'md', '#475569'),
        text(`👥 ${summary}`, 'md', '#64748b') ] } ] },
    footer: { type: 'box', layout: 'vertical', contents: [{ type: 'button', style: 'primary', color: '#087f3c', height: 'md',
      action: { type: 'uri', label: '我要報名', uri: link(id) } }] } } };
}

function formData() {
  const v = id => document.getElementById(id).value.trim();
  const data = { title: v('t'), date: v('d'), time: v('h'), place: v('p') };
  if (!data.title || !data.date) return alert('請填寫活動名稱與日期');
  return data;
}

// 建立人自己的人數（Gemini：A 案）：寫進 entries，新活動卡上就含他的報名，群組只多一張卡；手動點選蓋過接龍
function pickMine(n) {
  entries = entries.filter(e => e.family !== state.family).concat([{ family: state.family, count: n }]);
  showEntries();
}

function showEntries() {
  const mine = entries.find(e => e.family === state.family);
  document.querySelectorAll('#mine button').forEach(b => b.classList.toggle('primary', !!mine && Number(b.dataset.n) === mine.count));
  const added = entries.filter(e => !state.families.includes(e.family)).map(e => esc(e.family));
  document.getElementById('list').innerHTML = entries.length ? `<p><b>已帶入名單（共 ${entries.reduce((n, e) => n + e.count, 0)} 人）：</b><br>
    ${entries.map(e => `• ${esc(e.family)}：${e.count ? e.count + ' 人' : '不去'}`).join('　')}</p>
    ${added.length ? `<p class="warn">⚠️ 將新增稱呼：${added.join('、')}（請確認名稱是否正確）</p>` : ''}` : '';
}

const create = () => {
  const data = formData();
  if (data) run(async () => { await call('create', { ...data, entries }); await notify([eventFlex({ ...data, entries }, state.created)]); home(); });
};

// 只有日期／時間／地點變了才通知群組；只改名稱（例如加「（取消）」）不發
const save = i => {
  const old = state.events[i], data = formData();
  if (!data || !confirm('確定儲存修改？')) return;
  const changes = [['日期', fmtDate(old.date), fmtDate(data.date)], ['時間', old.time || '未定', data.time || '未定'],
                   ['地點', old.place || '未定', data.place || '未定']]
    .filter(([, a, b]) => a !== b).map(([k, a, b]) => `${k}：${a} → ${b}`);
  run(async () => {
    await call('edit', { eventId: old.id, ...data });
    if (changes.length) await notify([changeFlex({ ...data, id: old.id }, changes.join('\n'))]);
    const j = state.events.findIndex(e => e.id === old.id);
    j >= 0 ? detail(j) : home();
  });
};

// 活動異動卡片（Gemini 設計）：橘色標籤＋變更內容，按鈕直達該活動
function changeFlex(ev, changes) {
  const row = (k, v, bold) => ({ type: 'box', layout: 'baseline', spacing: 'sm', contents: [
    { type: 'text', text: k, color: '#6b7280', size: 'sm', flex: 1 },
    { type: 'text', text: v, wrap: true, color: '#111827', size: 'md', flex: 4, ...(bold && { weight: 'bold' }) }] });
  return { type: 'flex', altText: `⚠️ 活動異動通知：${ev.title}`, contents: { type: 'bubble', size: 'mega',
    header: { type: 'box', layout: 'horizontal', paddingBottom: 'none', contents: [
      { type: 'box', layout: 'horizontal', flex: 0, backgroundColor: '#e65100', paddingAll: 'xs', paddingStart: 'md',
        paddingEnd: 'md', cornerRadius: 'md', contents: [{ type: 'text', text: '⚠️ 活動異動', color: '#ffffff', size: 'sm', weight: 'bold' }] }] },
    body: { type: 'box', layout: 'vertical', contents: [
      { type: 'text', text: ev.title, weight: 'bold', size: 'xl', wrap: true, color: '#1f2937' },
      { type: 'box', layout: 'vertical', backgroundColor: '#fffbeb', paddingAll: 'md', cornerRadius: 'md', margin: 'md',
        borderColor: '#fde68a', borderWidth: 'semi-bold', contents: [
          { type: 'text', text: '異動內容', size: 'xs', color: '#b45309', weight: 'bold' },
          { type: 'text', text: changes, size: 'md', color: '#9a3412', wrap: true, weight: 'bold' }] },
      { type: 'separator', margin: 'lg' },
      { type: 'box', layout: 'vertical', margin: 'lg', spacing: 'sm', contents: [
        row('時間', `${fmtDate(ev.date)} ${ev.time}`.trim(), true), row('地點', ev.place || '地點待定')] }] },
    footer: { type: 'box', layout: 'vertical', contents: [{ type: 'button', style: 'primary', color: '#087f3c', height: 'md',
      action: { type: 'uri', label: '確認是否出席', uri: link(ev.id) } }] } } };
}
</script>
</body>
</html>
